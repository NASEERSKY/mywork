<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        header { background: #35424a; color: #ffffff; padding: 10px 0; text-align: center; }
        form { background: #ffffff; padding: 20px; margin: 20px auto; border-radius: 5px; width: 300px; }
        input[type='text'], input[type='password'] { width: 100%; padding: 10px; margin: 10px 0; }
        input[type='submit'] { background: #35424a; color: #ffffff; border: none; padding: 10px; cursor: pointer; }
        input[type='submit']:hover { background: #e8491d; }
    </style>
</head>
<body>
    <header>
        <h1>Student Management System</h1>
    </header>
    <div>
        <form id="loginForm">
            <h2>Login</h2>
            <input type="text" id="loginUser" placeholder="Username" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <input type="submit" value="Login">
        </form>
        <form id="registrationForm">
            <h2>Register</h2>
            <input type="text" id="regUser" placeholder="Username" required>
            <input type="password" id="regPass" placeholder="Password" required>
            <input type="submit" value="Register">
        </form>
        <form id="studentDataForm">
            <h2>Student Data</h2>
            <input type="text" id="studentName" placeholder="Student Name" required>
            <input type="text" id="studentID" placeholder="Student ID" required>
            <input type="text" id="studentGrade" placeholder="Grade" required>
            <input type="submit" value="Add Student">
        </form>
    </div>
    <script>
        document.getElementById('loginForm').onsubmit = function(event) {
            event.preventDefault();
            // Add login logic here
            alert('Login submitted!');
        };
        document.getElementById('registrationForm').onsubmit = function(event) {
            event.preventDefault();
            // Add registration logic here
            alert('Registration submitted!');
        };
        document.getElementById('studentDataForm').onsubmit = function(event) {
            event.preventDefault();
            // Add student data submission logic here
            alert('Student data submitted!');
        };
    </script>
</body>
</html>
