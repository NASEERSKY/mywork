<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
</head>
<body>
    <h1>Student Registration System</h1>
    <div>
        <h2>Login</h2>
        <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br>
            <button type="submit">Login</button>
        </form>
    </div>
    <div>
        <h2>Registration</h2>
        <form id="registration-form">
            <label for="reg-username">Username:</label>
            <input type="text" id="reg-username" name="reg-username" required><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>
            <label for="reg-password">Password:</label>
            <input type="password" id="reg-password" name="reg-password" required><br>
            <button type="submit">Register</button>
        </form>
    </div>
    <div>
        <h2>Student Data Entry</h2>
        <form id="student-data-form">
            <label for="student-name">Student Name:</label>
            <input type="text" id="student-name" name="student-name" required><br>
            <label for="student-id">Student ID:</label>
            <input type="text" id="student-id" name="student-id" required><br>
            <label for="course">Course:</label>
            <input type="text" id="course" name="course" required><br>
            <button type="submit">Submit Data</button>
        </form>
    </div>
</body>
</html>
